name: Log Analyzer CI

on:
  push:
    paths:
      - "log-analyzer/**"
      - ".github/workflows/log-analyzer-ci.yml"
  pull_request:
    paths:
      - "log-analyzer/**"
      - ".github/workflows/log-analyzer-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test Log Analyzer
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: log-analyzer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false

      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Build application
        run: go build ./...
